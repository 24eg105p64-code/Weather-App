<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline Dispatch — Weather Postcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="postcard">
  <div class="postcard-inner">

    <header class="postcard-header">
      <span class="eyebrow">✈ Weather Post — Air Mail</span>
      <h1 class="brand">Skyline Dispatch</h1>
      <p class="tagline">A postcard from the sky, wherever you're headed.</p>
    </header>

    <div class="search-box">
      <label for="city" class="field-label">Destination City</label>
      <div class="input-row">
        <input type="text" id="city" placeholder="e.g. Mumbai" autocomplete="off">
        <button onclick="getWeather()">Send ✈</button>
      </div>
    </div>

    <p id="errorBox" class="error-box"></p>

    <div id="weather" class="postcard-body">

      <div class="message-panel">
        <p class="salutation">Dear traveler,</p>
        <img id="icon" class="weather-icon" src="https://cdn-icons-png.flaticon.com/512/869/869869.png" alt="weather icon" width="64">
        <p id="condition" class="condition-text">Search a city above to receive your weather dispatch.</p>
      </div>

      <div class="perforation" aria-hidden="true"></div>

      <div class="address-panel">
        <div class="postmark" id="postmark">
          <span class="postmark-city" id="cityName">—</span>
          <span class="postmark-date" id="dateStamp">· · ·</span>
        </div>

        <div class="temp-stamp" id="temp">--°</div>

        <div class="stat-row">
          <div class="stub">
            <span class="stub-label">Humidity</span>
            <span class="stub-value" id="humidity">--%</span>
          </div>
          <div class="stub">
            <span class="stub-label">Wind</span>
            <span class="stub-value" id="wind">-- km/h</span>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
