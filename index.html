<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <h1>🌤 Weather App</h1>

    <div class="search-box">
        <input type="text" id="city" placeholder="Enter City Name">
        <button onclick="getWeather()">Search</button>
    </div>

    <p id="errorBox" class="error-box"></p>

    <div id="weather" class="weather-box">

        <img id="icon" src="https://cdn-icons-png.flaticon.com/512/869/869869.png" width="100">

        <h2 id="cityName">Search a City</h2>

        <h1 id="temp">--°C</h1>

        <p id="condition">Weather</p>

        <div class="details">

            <div class="box">
                💧
                <h3 id="humidity">--%</h3>
                <p>Humidity</p>
            </div>

            <div class="box">
                💨
                <h3 id="wind">-- km/h</h3>
                <p>Wind</p>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
